name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Secret scan
        run: echo "gitleaks detect --no-git -v"
