# This workflow is inert while template/ sits inside the prod-ready-ai-app toolkit
# repository: GitHub Actions only discovers workflows under the repository ROOT
# .github/workflows/ directory, and this file lives under template/.github/workflows/
# instead. It activates automatically once a team copies template/ out to the root
# of a new repository. The toolkit reference below points at
# mmoideen/prod-ready-ai-app. Repoint it if your org hosts a fork of the toolkit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: "mmoideen/prod-ready-ai-app/.github/workflows/reusable-ci.yml@main"
    with:
      node-version: "20"
      working-directory: "."
      test-command: "npm test"
