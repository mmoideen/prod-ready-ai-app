# NOTE: This workflow is inert while examples/minimal-ai-tool lives nested
# inside the prod-ready-ai-app toolkit repository: GitHub only runs
# workflows found at the repository root. It becomes active once this
# example is copied out into its own repository (repoint the toolkit
# reference at your fork if you host one), and the deployment target's
# secrets (for example VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID) are
# configured on the new repository. `secrets: inherit` passes the caller
# repository's secrets straight through to the reusable deploy workflow.
name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    uses: "mmoideen/prod-ready-ai-app/.github/workflows/reusable-deploy.yml@main"
    with:
      environment: "production"
      working-directory: "."
    secrets: inherit
