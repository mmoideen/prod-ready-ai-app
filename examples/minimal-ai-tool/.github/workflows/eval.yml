# NOTE: This workflow is inert while examples/minimal-ai-tool lives nested
# inside the prod-ready-ai-app toolkit repository: GitHub only runs
# workflows found at the repository root. It becomes active once this
# example is copied out into its own repository. Repoint the composite
# action reference at your fork of prod-ready-ai-app if you host one.
name: Eval gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run evaluation gate
        uses: "mmoideen/prod-ready-ai-app/actions/reusable-eval-gate@main"
        with:
          eval-command: "npm run eval"
          working-directory: "."
