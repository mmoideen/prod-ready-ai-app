# Dependency update automation for the toolkit repository itself.
# Minor and patch updates are grouped into a single weekly PR per package
# area to keep review load low; major updates stay individual because they
# can carry breaking changes that need their own review and test pass.
version: 2
updates:
  - package-ecosystem: npm
    directory: /scorecard
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    groups:
      scorecard-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /template
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    groups:
      template-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /examples/minimal-ai-tool
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    groups:
      example-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    groups:
      actions-all:
        patterns:
          - "*"
