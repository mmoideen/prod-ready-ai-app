# NOTE: This workflow is inert while examples/minimal-ai-tool lives nested
# inside the prod-ready-ai-app toolkit repository: GitHub only runs
# workflows found at the repository root. It becomes active once this
# example is copied out into its own repository. Repoint the toolkit
# reference at your fork of prod-ready-ai-app if you host one.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Runs even while the reusable-ci job below is inert, so this file always
  # demonstrates a real push/pull_request triggered step.
  context:
    runs-on: ubuntu-latest
    steps:
      - name: Note toolkit context
        run: 'echo "minimal-ai-tool CI note. The reusable-ci job below consumes the toolkit at mmoideen/prod-ready-ai-app. Repoint it if your org hosts a fork."'

  ci:
    uses: "mmoideen/prod-ready-ai-app/.github/workflows/reusable-ci.yml@main"
    with:
      node-version: "20"
      working-directory: "."
      test-command: "npm test"
      run-secret-scan: true
