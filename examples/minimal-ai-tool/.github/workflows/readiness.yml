# NOTE: This workflow is inert while examples/minimal-ai-tool lives nested
# inside the prod-ready-ai-app toolkit repository: GitHub only runs
# workflows found at the repository root (and the composite action clones
# the toolkit at its @main ref, not this working tree). It becomes active
# once this example is copied out into its own repository. Repoint the
# action reference at your fork of prod-ready-ai-app if you host one.
# `path: "."` assumes this example is the repository root once copied out;
# adjust if you nest it elsewhere.
name: Readiness gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check production readiness
        uses: "mmoideen/prod-ready-ai-app/actions/reusable-readiness@main"
        with:
          path: "."
          min-score: "85"
          advisory: "false"
          toolkit-repo: "mmoideen/prod-ready-ai-app"
          toolkit-ref: "main"
