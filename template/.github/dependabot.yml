# This configuration is inert while template/ sits inside the prod-ready-ai-app
# toolkit repository: GitHub only reads dependabot.yml from the repository ROOT
# .github/ directory, and this file lives under template/.github/ instead. It
# activates automatically once a team copies template/ out to the root of a new
# repository.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    groups:
      actions-all:
        patterns:
          - "*"
