name: Reusable CI action
description: Reusable composite action for common Node.js CI steps (lint, typecheck, build, test)

inputs:
  node-version:
    description: Node.js version
    required: false
    default: "20"
  working-directory:
    description: Working directory for npm commands
    required: false
    default: "."
  test-command:
    description: Test command to run
    required: false
    default: "npm test"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}

    - name: Check for package-lock.json and install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ -f "package-lock.json" ]; then
          npm ci
        else
          npm install
        fi

    - name: Check if lint script exists and run linter
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if node -e "process.exit((require('./package.json').scripts || {}).lint ? 0 : 1)"; then
          npm run lint
        else
          echo "No lint script found, skipping"
        fi

    - name: Check if typecheck script exists and run typecheck
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if node -e "process.exit((require('./package.json').scripts || {}).typecheck ? 0 : 1)"; then
          npm run typecheck
        else
          echo "No typecheck script found, skipping"
        fi

    - name: Check if build script exists and run build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if node -e "process.exit((require('./package.json').scripts || {}).build ? 0 : 1)"; then
          npm run build
        else
          echo "No build script found, skipping"
        fi

    - name: Run tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.test-command }}
